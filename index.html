<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ショート構成分析</title>
<style>
:root {
  --ink: #1d1f24; --ink2: #555a64; --ink3: #8b909a;
  --bg: #f4f2ed; --card: #ffffff; --line: #e3dfd6; --soft: #faf8f4;
  --accent: #e4572e; --accent-soft: #fde9e2; --ok: #2f8f5b; --danger: #c0392b;
  --radius: 10px;
  --font: "BIZ UDPGothic", "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ---- top bar ---- */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; padding: 0 20px; height: 54px; background: var(--ink); color: #fff; }
.brand { font-weight: 700; letter-spacing: .04em; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand-mark { color: var(--accent); letter-spacing: -2px; font-size: 13px; }
nav { display: flex; gap: 4px; flex: 1; }
nav button { background: none; border: 0; color: #b9bdc6; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
nav button:hover { color: #fff; background: rgba(255,255,255,.07); }
nav button.active { color: #fff; background: rgba(255,255,255,.13); box-shadow: inset 0 -2px 0 var(--accent); }
.icon-btn { background: none; border: 1px solid rgba(255,255,255,.25); color: #ddd; border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.icon-btn:hover { background: rgba(255,255,255,.08); }

.panel { position: fixed; right: 20px; top: 62px; z-index: 30; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.12); max-width: 560px; }
.panel h3 { margin: 0 0 4px; font-size: 15px; }

.tab { min-height: 60vh; }
main { max-width: 1240px; margin: 0 auto; padding: 22px 20px 80px; }

/* ---- generic ---- */
.btn { border: 1px solid var(--line); background: var(--card); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--ink3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink2); }
.btn.ghost:hover { background: rgba(0,0,0,.05); }
.btn.danger-outline { color: var(--danger); border-color: #e9c3bd; }
.btn.danger { color: var(--danger); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.hint { color: var(--ink3); font-size: 12.5px; margin: 4px 0 10px; }
.empty { text-align: center; color: var(--ink3); padding: 60px 20px; border: 2px dashed var(--line); border-radius: var(--radius); }
.empty .btn { margin-top: 14px; }
h2.page { font-size: 20px; margin: 0; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.seg { display: inline-flex; background: #e9e5dc; border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--ink2); font-weight: 600; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
input[type=text], input[type=number], input[type=url], input[type=date], input[type=search], select, textarea {
  border: 1px solid var(--line); background: var(--card); border-radius: 7px; padding: 6px 9px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid #f5b8a5; border-color: var(--accent); }
textarea { width: 100%; resize: vertical; min-height: 54px; }

.badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 99px; }
.badge.research { background: #e4eefb; color: #2b5c9e; }
.badge.plan { background: #fff1d6; color: #9a6a00; }
.badge.posted { background: #dff3e7; color: #23774a; }

/* ---- band ---- */
.band { position: relative; height: 22px; border-radius: 6px; background: repeating-linear-gradient(45deg, #efece5, #efece5 6px, #e8e4dc 6px, #e8e4dc 12px); overflow: hidden; }
.band .seg-b { position: absolute; top: 0; bottom: 0; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; padding-left: 5px; overflow: hidden; white-space: nowrap; border-right: 1px solid rgba(255,255,255,.6); }
.band .cut-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .55; }
.band.empty-band { display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: var(--ink3); }
.band-scale { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink3); margin-top: 2px; }

/* ---- list ---- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; cursor: pointer; display: flex; gap: 12px; transition: box-shadow .15s, transform .15s; }
.card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.08); transform: translateY(-1px); }
.card .thumb { width: 64px; height: 114px; border-radius: 6px; background: #ece8df center/cover; flex: none; display: flex; align-items: center; justify-content: center; color: var(--ink3); font-size: 20px; }
.card .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.card .title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .meta { color: var(--ink2); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; background: var(--soft); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; color: var(--ink2); }

/* ---- edit ---- */
.edit-grid { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
.box > h3 { margin: 0 0 10px; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
.box > h3 .count { background: var(--ink); color: #fff; font-size: 12px; border-radius: 99px; padding: 0 9px; }
.box > h3 .sub { font-weight: 400; color: var(--ink3); font-size: 12px; }
.sticky-col { position: sticky; top: 70px; }
.field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 9px; }
.field label { font-size: 12px; color: var(--ink2); font-weight: 600; }
.field input, .field select { width: 100%; }
.fields2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.fields3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 8px; }
.timebar { display: flex; align-items: center; gap: 6px; background: var(--ink); color: #fff; border-radius: 9px; padding: 8px 10px; margin: 0 0 10px; flex-wrap: wrap; }
.timebar input { width: 76px; background: #2c2f36; border-color: #444; color: #fff; font-weight: 700; text-align: right; }
.timebar .lbl { font-size: 12px; color: #b9bdc6; }
.timebar .btn { background: #2c2f36; border-color: #444; color: #fff; }
.timebar .btn.primary { background: var(--accent); border-color: var(--accent); }

.blockbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.blockbtn { border: 0; color: #fff; border-radius: 7px; padding: 5px 11px; font-weight: 700; cursor: pointer; font-size: 12.5px; }
.blockbtn:hover { filter: brightness(1.08); }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }

table.rows { width: 100%; border-collapse: collapse; font-size: 13px; }
table.rows th { text-align: left; font-size: 11.5px; color: var(--ink3); font-weight: 600; padding: 4px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.rows td { padding: 4px 4px; border-bottom: 1px solid #f0ede6; vertical-align: top; }
table.rows input, table.rows select { width: 100%; padding: 4px 6px; }
table.rows input.t { width: 64px; text-align: right; }
table.rows td.x { width: 28px; }
.xbtn { border: 0; background: none; color: var(--ink3); cursor: pointer; font-size: 16px; line-height: 1; padding: 4px; }
.xbtn:hover { color: var(--danger); }
.addrow { margin-top: 8px; }

.player-box .row { margin-bottom: 8px; }
.share-state { font-size: 12px; color: var(--ink3); }
.share-state.on { color: var(--ok); font-weight: 700; }
.shot-btn { font-size: 15px; padding: 9px 16px; }

.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.shot { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--soft); display: flex; flex-direction: column; }
.shot img { width: 100%; aspect-ratio: 9/12; object-fit: cover; background: #222; cursor: zoom-in; display: block; }
.shot .shot-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.note { display: grid; grid-template-columns: 90px 1fr 24px; gap: 4px; align-items: start; }
.note select, .note input { padding: 3px 5px; font-size: 12.5px; }
.note textarea { min-height: 38px; font-size: 12.5px; grid-column: 1 / 3; }

.memo { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; background: var(--soft); }
.memo input { width: 100%; font-weight: 700; margin-bottom: 6px; }
.memo textarea { min-height: 80px; }

.stats-inline { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
.stats-inline b { color: var(--ink); font-size: 14px; }

/* ---- player ---- */
.player-frame { position: relative; width: 100%; aspect-ratio: 9 / 16; max-height: 70vh; margin: 0 auto 8px; background: #111; border-radius: 9px; overflow: hidden; }
.player-frame iframe, .player-frame #yt-holder { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* ---- templates ---- */
.tpl { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.tpl .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.tpl .head input { font-weight: 700; font-size: 15px; border-color: transparent; background: transparent; padding-left: 0; }
.tpl .head input:hover, .tpl .head input:focus { border-color: var(--line); background: var(--card); padding-left: 9px; }
.tpl .kpis { display: flex; gap: 18px; font-size: 12.5px; color: var(--ink2); }
.tpl .kpis b { color: var(--ink); font-size: 16px; }
.tpl .notes3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.tpl .notes3 label { font-size: 11.5px; font-weight: 700; color: var(--ink2); }

/* ---- analyze ---- */
.compare { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
.cmp-row { display: grid; grid-template-columns: 220px 90px 1fr; gap: 12px; align-items: center; padding: 5px 0; }
.cmp-row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; cursor: pointer; }
.cmp-row .t:hover { color: var(--accent); }
.cmp-row .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.table-wrap { overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); }
table.grid th, table.grid td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid th { text-align: left; font-size: 12px; color: var(--ink2); background: var(--soft); cursor: pointer; user-select: none; }
table.grid th.sorted::after { content: " ▼"; color: var(--accent); }
table.grid td.n { text-align: right; font-variant-numeric: tabular-nums; }
table.grid tr:hover td { background: #fbf9f5; }
.insights { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 16px; }
.insight { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.insight .k { font-size: 12px; color: var(--ink2); font-weight: 600; }
.insight .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.insight .s { font-size: 11.5px; color: var(--ink3); }

/* ---- overlay & toast ---- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(15,16,20,.85); display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
.overlay img { max-width: 92vw; max-height: 92vh; border-radius: 8px; }
#toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 9px; box-shadow: 0 6px 20px rgba(0,0,0,.2); transition: opacity .5s; max-width: 80vw; }
.toast.error { background: var(--danger); }
.toast.out { opacity: 0; }

@media (max-width: 900px) {
  .topbar { gap: 8px; padding: 0 10px; height: auto; min-height: 54px; flex-wrap: wrap; }
  .brand { font-size: 13px; }
  nav button { padding: 8px 10px; }
  main { padding: 14px 10px 80px; }
  .player-frame { max-height: 62vh; }
  table.rows { display: block; overflow-x: auto; }
  /* スマホ：動画とカットボタンを上に固定して、下の内容だけスクロール */
  .topbar { position: static; }
  .sticky-col { display: contents; }
  .player-box { position: sticky; top: 0; z-index: 15; margin: 0 -10px 12px; border-radius: 0; border-left: 0; border-right: 0; padding: 6px 8px 4px; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
  .player-box .player-title, .player-box > .hint { display: none; }
  .player-frame { width: auto; height: 34vh; max-height: none; margin-bottom: 6px; }
  .player-box .share-state { font-size: 11px; }
  .player-box .row { margin: 4px 0 2px; }
  .timebar { flex-wrap: nowrap; margin: 0 0 4px; padding: 6px 8px; }
  .timebar input { width: 64px; }
  .timebar .btn.primary { padding: 9px 14px; font-size: 15px; }
  .wide-only { display: none; }
  .edit-grid { grid-template-columns: 1fr; }
  .sticky-col { position: static; }
  .cmp-row { grid-template-columns: 1fr 70px; }
  .cmp-row .band { grid-column: 1 / 3; }
  .tpl .notes3 { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">▮▮▯</span>ショート構成分析</div>
  <nav>
    <button data-tab="list" class="active">一覧</button>
    <button data-tab="edit">編集</button>
    <button data-tab="templates">型</button>
    <button data-tab="analyze">分析</button>
  </nav>
  <button id="btn-settings" class="icon-btn" title="バックアップ">⚙ バックアップ</button>
</header>

<div id="settings-panel" class="panel hidden">
  <h3>バックアップ</h3>
  <p class="hint">スクショも含めて全データを1つのファイルに保存します。</p>
  <div class="row">
    <button id="export" class="btn primary">書き出し</button>
    <button id="import-add" class="btn">読み込み（今のデータに追加）</button>
    <button id="import-replace" class="btn danger-outline">読み込み（置き換え）</button>
  </div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
</div>

<main>
  <section id="tab-list" class="tab"></section>
  <section id="tab-edit" class="tab hidden"></section>
  <section id="tab-templates" class="tab hidden"></section>
  <section id="tab-analyze" class="tab hidden"></section>
</main>

<div id="overlay" class="overlay hidden"></div>
<div id="toasts"></div>
<script>
// ===== model.js : データ生成・正規化 =====
var DEFAULT_BLOCK_TYPES = [
  { name: 'フック', color: '#e4572e' },
  { name: '前振り', color: '#f3a712' },
  { name: '展開', color: '#4c9f70' },
  { name: 'オチ', color: '#3d5a80' },
  { name: 'CTA', color: '#9b5de5' }
];
var KIND_LABELS = { research: '研究', plan: '企画', posted: '自分の投稿' };

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function num(v) {
  var n = Number(v);
  return isFinite(n) && v !== '' && v !== null ? n : 0;
}

function newShort(kind) {
  var now = Date.now();
  return {
    id: uid(), kind: kind || 'research', title: '', url: '', channel: '',
    duration: 0, postedAt: '', views: 0, likes: 0, comments: 0, templateId: null,
    tags: [], blocks: [], cuts: [], telops: [], ses: [], shots: [], memos: [],
    createdAt: now, updatedAt: now
  };
}

function byT(a, b) { return a.t - b.t; }

function normalizeShort(s) {
  var o = Object.assign(newShort(s.kind), s);
  ['duration', 'views', 'likes', 'comments'].forEach(function (k) { o[k] = num(o[k]); });
  var d = o.duration;
  o.blocks = (o.blocks || []).map(function (b) {
    var st = num(b.start), en = num(b.end);
    if (st > en) { var x = st; st = en; en = x; }
    if (d > 0) { st = Math.min(Math.max(st, 0), d); en = Math.min(Math.max(en, 0), d); }
    return Object.assign({}, b, { start: st, end: en, memo: b.memo || '' });
  }).sort(function (a, b) { return a.start - b.start; });
  ['cuts', 'telops', 'ses'].forEach(function (k) {
    o[k] = (o[k] || []).map(function (r) { return Object.assign({}, r, { t: num(r.t) }); }).sort(byT);
  });
  o.tags = (o.tags || []).filter(Boolean);
  o.shots = o.shots || [];
  o.memos = o.memos || [];
  return o;
}

function templateFromShort(s, name) {
  var d = num(s.duration);
  return {
    id: uid(), name: name || s.title || '無題の型', sourceId: s.id, duration: d,
    blocks: (s.blocks || []).map(function (b) {
      return {
        type: b.type, start: num(b.start), end: num(b.end), memo: b.memo || '',
        startRatio: d > 0 ? num(b.start) / d : null,
        endRatio: d > 0 ? num(b.end) / d : null
      };
    }),
    notes: { cut: '', telop: '', se: '' },
    createdAt: Date.now()
  };
}

function shortFromTemplate(t, duration) {
  var s = newShort('plan');
  var d = num(duration) > 0 ? num(duration) : num(t.duration);
  s.duration = d;
  s.templateId = t.id;
  s.title = t.name + 'の企画';
  s.blocks = (t.blocks || []).map(function (b) {
    var useRatio = b.startRatio != null && d > 0;
    return {
      type: b.type, memo: b.memo || '',
      start: useRatio ? Math.round(b.startRatio * d * 10) / 10 : num(b.start),
      end: useRatio ? Math.round(b.endRatio * d * 10) / 10 : num(b.end)
    };
  });
  return s;
}

// 動画URL → アプリに取られにくい埋め込み専用の再生URL
function playerUrl(raw) {
  var u = String(raw || '').trim();
  if (!u) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  if (!/^https?:\/\//i.test(u)) return null;
  var m = u.match(/(?:youtube\.com\/(?:shorts\/|embed\/|live\/|watch\?(?:.*&)?v=)|youtu\.be\/)([A-Za-z0-9_-]{11})/i);
  if (m) {
    var id = m[1];
    return { site: 'youtube', id: id, url: 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&loop=1&playlist=' + id + '&playsinline=1&rel=0' };
  }
  m = u.match(/tiktok\.com\/.*\/video\/(\d+)/i);
  if (m) return { site: 'tiktok', url: 'https://www.tiktok.com/player/v1/' + m[1] + '?autoplay=1&loop=1' };
  m = u.match(/instagram\.com\/(?:reel|reels|p)\/([A-Za-z0-9_-]+)/i);
  if (m) return { site: 'instagram', url: 'https://www.instagram.com/reel/' + m[1] + '/embed/' };
  return { site: 'other', url: u };
}

if (typeof module !== 'undefined') module.exports = { playerUrl: playerUrl,
  DEFAULT_BLOCK_TYPES: DEFAULT_BLOCK_TYPES, KIND_LABELS: KIND_LABELS, uid: uid, num: num,
  newShort: newShort, normalizeShort: normalizeShort,
  templateFromShort: templateFromShort, shortFromTemplate: shortFromTemplate
};

// ===== analysis.js : 指標計算 =====
function firstBlock(s, type) {
  var bs = (s.blocks || []).filter(function (b) { return b.type === type; });
  bs.sort(function (a, b) { return a.start - b.start; });
  return bs[0] || null;
}

function metrics(s) {
  var d = Number(s.duration) || 0;
  var hook = firstBlock(s, 'フック');
  var punch = firstBlock(s, 'オチ');
  var cutCount = (s.cuts || []).length;
  return {
    hookSec: hook ? Math.round((hook.end - hook.start) * 10) / 10 : null,
    punchPct: punch && d > 0 ? Math.round(punch.start / d * 100) : null,
    hasCTA: !!firstBlock(s, 'CTA'),
    cutCount: cutCount,
    avgCutSec: d > 0 ? Math.round(d / (cutCount + 1) * 10) / 10 : null
  };
}

function templateStats(templateId, shorts) {
  var ps = (shorts || []).filter(function (s) { return s.kind === 'posted' && s.templateId === templateId; });
  if (!ps.length) return { count: 0, avgViews: null };

function validateImport(text) {

// ===== db.js : IndexedDB =====
var DB_NAME = 'short-kousei';
var _db = null;

function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise(function (res, rej) {
    var r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = function () {
      var db = r.result;
      ['shorts', 'templates', 'settings'].forEach(function (n) {
        if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, { keyPath: 'id' });
      });
    };
    r.onsuccess = function () { _db = r.result; res(_db); };
    r.onerror = function () { rej(r.error); };
  });
}

function _tx(store, mode, fn) {
  return openDB().then(function (db) {
    return new Promise(function (res, rej) {
      var t = db.transaction(store, mode);
      var out = fn(t.objectStore(store));
      t.oncomplete = function () { res(out && out.result !== undefined ? out.result : undefined); };
      t.onerror = function () { rej(t.error); };
      t.onabort = function () { rej(t.error); };
    });
  });
}

function getAll(store) { return _tx(store, 'readonly', function (s) { return s.getAll(); }); }
function put(store, obj) { return _tx(store, 'readwrite', function (s) { s.put(obj); }); }
function del(store, id) { return _tx(store, 'readwrite', function (s) { s.delete(id); }); }
function putMany(store, arr) { return _tx(store, 'readwrite', function (s) { arr.forEach(function (o) { s.put(o); }); }); }
function clearAll() {
  return openDB().then(function (db) {
    return new Promise(function (res, rej) {
      var t = db.transaction(['shorts', 'templates', 'settings'], 'readwrite');
      ['shorts', 'templates', 'settings'].forEach(function (n) { t.objectStore(n).clear(); });
      t.oncomplete = function () { res(); };
      t.onerror = function () { rej(t.error); };
    });
  });
}

// ===== capture.js : 画面共有と撮影 =====
var Capture = { stream: null, video: null, endedCbs: [] };

function isSharing() {
  var s = Capture.stream;
  return !!(s && s.getVideoTracks().some(function (t) { return t.readyState === 'live'; }));
}

function onShareEnded(cb) { Capture.endedCbs.push(cb); }

function _shareEnded() {
  Capture.stream = null;
  if (Capture.video) { Capture.video.srcObject = null; }
  Capture.endedCbs.forEach(function (cb) { try { cb(); } catch (e) { /* noop */ } });
}

function startShare() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    return Promise.reject(new Error('このブラウザは画面共有に対応していません（Chrome か Edge で開いてください）'));
  }
  return navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false, preferCurrentTab: true, selfBrowserSurface: 'include' }).then(function (stream) {
    Capture.stream = stream;
    stream.getVideoTracks().forEach(function (t) { t.addEventListener('ended', _shareEnded); });
    if (!Capture.video) {
      Capture.video = document.createElement('video');
      Capture.video.muted = true;
      Capture.video.playsInline = true;
    }
    Capture.video.srcObject = stream;
    return Capture.video.play().catch(function () {}).then(function () { return _waitFrame(); });
  });
}

function stopShare() {
  if (Capture.stream) Capture.stream.getTracks().forEach(function (t) { t.stop(); });
  _shareEnded();
}

function _waitFrame() {
  var v = Capture.video;
  return new Promise(function (res) {
    var n = 0;
    (function check() {
      if (v.videoWidth > 0 || n++ > 60) return res();
      setTimeout(check, 50);
    })();
  });
}

// 要素の位置（画面上）→ 撮った画像上の切り抜き範囲
function cropRect(el, view, frame) {
  var sx = frame.w / view.w, sy = frame.h / view.h;
  var x0 = Math.max(0, Math.round(el.left * sx)), y0 = Math.max(0, Math.round(el.top * sy));
  var x1 = Math.min(frame.w, Math.round((el.left + el.width) * sx)), y1 = Math.min(frame.h, Math.round((el.top + el.height) * sy));
  if (x1 - x0 < 8 || y1 - y0 < 8) return null;
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

function fitSize(w, hh) {
  var scale = Math.min(1, 1080 / Math.max(w, hh));
  return { w: Math.round(w * scale), h: Math.round(hh * scale) };
}

function toJpeg(src, sx, sy, sw, sh) {
  var f = fitSize(sw, sh);
  var c = document.createElement('canvas');
  c.width = f.w; c.height = f.h;
  c.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, f.w, f.h);
  return c.toDataURL('image/jpeg', 0.85);
}

// cropEl を渡すと、このタブを共有している時はその要素の部分だけを切り抜く
function grabFrame(cropEl) {
  if (!isSharing()) return Promise.reject(new Error('画面共有が止まっています'));
  return _waitFrame().then(function () {
    var v = Capture.video, w = v.videoWidth, hh = v.videoHeight;
    if (!w || !hh) throw new Error('画面を取得できませんでした');
    var r = null;
    if (cropEl) {
      var tr = Capture.stream.getVideoTracks()[0];
      var surface = tr && tr.getSettings ? tr.getSettings().displaySurface : '';
      var vw = window.innerWidth, vh = window.innerHeight;
      var sameShape = Math.abs(w / hh - vw / vh) < 0.06;
      if (surface === 'browser' && sameShape) {
        var b = cropEl.getBoundingClientRect();
        r = cropRect({ left: b.left, top: b.top, width: b.width, height: b.height }, { w: vw, h: vh }, { w: w, h: hh });
      }
    }
    return r ? toJpeg(v, r.x, r.y, r.w, r.h) : toJpeg(v, 0, 0, w, hh);
  });
}

// 画像ファイル（スマホのスクショなど）→ 縮小したJPEG
function imageFileToJpeg(file) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { try { res(toJpeg(img, 0, 0, img.naturalWidth, img.naturalHeight)); } catch (e) { rej(e); } URL.revokeObjectURL(url); };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('画像を読み込めませんでした: ' + file.name)); };
    img.src = url;
  });
}

if (typeof module !== 'undefined') module.exports = { cropRect: cropRect, fitSize: fitSize };

var Player = { yt: null, ytReady: false, ytQueue: [], poll: null, site: null };

function loadYouTubeAPI(cb) {
  if (window.YT && window.YT.Player) return cb();
  Player.ytQueue.push(cb);
  if (document.getElementById('yt-api')) return;
  var prev = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = function () { if (prev) prev(); Player.ytQueue.splice(0).forEach(function (f) { f(); }); };
  var sc = document.createElement('script');
  sc.id = 'yt-api'; sc.src = 'https://www.youtube.com/iframe_api';
  sc.onerror = function () { var st = document.getElementById('player-state'); if (st) st.textContent = 'YouTubeの再生部品を読み込めませんでした（ネット接続を確認してください）'; };
  document.head.appendChild(sc);
}

function destroyPlayer() {
  clearInterval(Player.poll); Player.poll = null;
  if (Player.yt && Player.yt.destroy) { try { Player.yt.destroy(); } catch (e) { /* noop */ } }
  Player.yt = null; Player.site = null;
}

function setCurT(v, fromPlayer) {
  EditUI.curT = Math.max(0, Math.round(v * 10) / 10);
  var ti = document.getElementById('cur-t');
  if (ti && (fromPlayer ? document.activeElement !== ti : true)) ti.value = EditUI.curT;
  if (!fromPlayer && Player.yt && Player.yt.seekTo) { try { Player.yt.seekTo(EditUI.curT, true); } catch (e) { /* noop */ } }
}

function mountPlayer(frame, p) {
  destroyPlayer();
  Player.site = p.site;
  if (p.site === 'youtube') {
    var holder = h('div', { id: 'yt-holder' });
    frame.appendChild(holder);
    loadYouTubeAPI(function () {
      if (!document.body.contains(holder)) return;
      Player.yt = new YT.Player(holder, {
        videoId: p.id, width: '100%', height: '100%',
        playerVars: { playsinline: 1, rel: 0, loop: 1, playlist: p.id, modestbranding: 1, origin: location.origin },
        events: {
          onReady: function () { var st = document.getElementById('player-state'); if (st) st.textContent = '再生中の秒数が「今の秒数」に自動で入ります'; },
          onError: function (e) {
            var st = document.getElementById('player-state');
            if (st) st.textContent = (e.data === 101 || e.data === 150) ? 'この動画は投稿者が埋め込み再生を許可していません。下のリンクから元のページで見てください' : '再生エラー（' + e.data + '）。下のリンクから元のページで見てください';
          }
        }
      });
      clearInterval(Player.poll);
      Player.poll = setInterval(function () {
        var y = Player.yt;
        if (!y || !y.getPlayerState || !document.body.contains(frame)) return;
        if (y.getPlayerState() === 1) setCurT(y.getCurrentTime(), true);
      }, 200);
    });
  } else {
    frame.appendChild(h('iframe', { src: p.url, allow: 'autoplay; encrypted-media; picture-in-picture', allowfullscreen: true, referrerpolicy: 'strict-origin-when-cross-origin' }));
  }
}

var ListUI = { kind: 'all', q: '', sort: 'createdAt' };

function shortText(s) {
  var parts = [s.title, s.channel, s.url].concat(s.tags || []);
  (s.memos || []).forEach(function (m) { parts.push(m.title, m.body); });
  (s.blocks || []).forEach(function (b) { parts.push(b.memo); });
  (s.cuts || []).forEach(function (c) { parts.push(c.memo); });
  (s.telops || []).forEach(function (t) { parts.push(t.text, t.font, t.memo); });
  (s.ses || []).forEach(function (x) { parts.push(x.kind, x.memo); });
  (s.shots || []).forEach(function (sh) { (sh.notes || []).forEach(function (n) { parts.push(n.label, n.body); }); });
  return parts.filter(Boolean).join(' ').toLowerCase();
}

function sortShorts(arr, key) {
  var f = {
    views: function (a, b) { return (b.views || 0) - (a.views || 0); },
    postedAt: function (a, b) { return String(b.postedAt || '').localeCompare(String(a.postedAt || '')); },
    createdAt: function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); }
  }[key];
  return arr.slice().sort(f);
}

  el.appendChild(h('div', { class: 'toolbar' },

    h('button', { class: 'btn primary', id: 'new-research', onclick: function () { createShort('research'); } }, '＋ 研究'),
    h('button', { class: 'btn', id: 'new-plan', onclick: function () { createShort('plan'); } }, '＋ 企画')));
  el.appendChild(cardsWrap);
  drawCards();
}
window.renderList = renderList;

// ===== ui/templates.js : 型 =====
function renderTemplates(el) {
  var ts = App.state.templates.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
  el.appendChild(h('div', { class: 'toolbar' }, h('h2', { class: 'page', text: '型' }),
    h('span', { class: 'hint', style: { margin: 0 }, text: '編集画面の「型として保存」で増えます。型から企画を作り、投稿後に数字を入れると平均再生数が出ます。' })));
  if (!ts.length) {
    el.appendChild(h('div', { class: 'empty', text: 'まだ型がありません。伸びたショートを研究したら、編集画面の「型として保存」を押してください。' }));
    return;
  }
  ts.forEach(function (t) {
    var st = templateStats(t.id, App.state.shorts);
    var src = App.find(t.sourceId);
    t.notes = t.notes || { cut: '', telop: '', se: '' };
    var saveTimer;
    function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(function () { App.saveTemplate(t); }, 400); }
    function note(key, label, ph) {
      return h('div', null, h('label', { text: label }),
        h('textarea', { placeholder: ph, oninput: function (e) { t.notes[key] = e.target.value; saveSoon(); } }, t.notes[key] || ''));
    }
    el.appendChild(h('div', { class: 'tpl' },
      h('div', { class: 'head' },
        h('input', { type: 'text', value: t.name, oninput: function (e) { t.name = e.target.value; saveSoon(); } }),
        h('span', { class: 'spacer' }),
        h('div', { class: 'kpis num' },
          h('span', null, 'この型の投稿 ', h('b', { class: 'tpl-count', text: String(st.count) }), '本'),
          h('span', null, '平均再生 ', h('b', { class: 'tpl-avg', text: fmtNum(st.avgViews) })))),
      renderBand({ duration: t.duration, blocks: t.blocks, cuts: [] }, { scale: true }),
      h('div', { class: 'row', style: { marginTop: '8px' } },
        h('span', { class: 'hint', style: { margin: 0 } }, src ? h('a', { href: '#', onclick: function (e) { e.preventDefault(); App.go('edit', src.id); }, text: '元: ' + (src.title || '無題') }) : '元のショートは削除済み'),
        h('span', { class: 'spacer' }),
        h('button', { class: 'btn primary use-tpl', onclick: function () {
          var v = prompt('作る企画の尺（秒）', t.duration || '');
          if (v == null) return;
          var s = shortFromTemplate(t, Number(v) || 0);
          App.save(s).then(function (n) { toast('型「' + t.name + '」から企画を作りました'); App.go('edit', n.id); });
        } }, 'この型で企画を作る'),
        h('button', { class: 'btn danger del-tpl', onclick: function () {
          if (!confirm('型「' + t.name + '」を削除しますか？（作った企画は残ります）')) return;
          App.remove('templates', t.id).then(function () { App.render(); });
        } }, '削除')),
      h('div', { class: 'notes3' },
        note('cut', 'カットの傾向', '例：2秒ごとに切り替え'),
        note('telop', 'テロップの傾向', '例：太ゴシック・黄色縁・画面中央'),
        note('se', 'SEの傾向', '例：オチで「ドン」'))));
  });
}
window.renderTemplates = renderTemplates;

// ===== ui/analyze.js : 分析 =====
var AnalyzeUI = { kind: 'all', sort: 'views' };

function avgOf(arr, f) {
  var v = arr.map(f).filter(function (x) { return x != null && isFinite(x); });
  if (!v.length) return null;
  return Math.round(v.reduce(function (a, b) { return a + b; }, 0) / v.length * 10) / 10;
}

function renderAnalyze(el) {
  var body = h('div');
  function draw() {
    body.innerHTML = '';
    var arr = App.state.shorts.filter(function (s) { return AnalyzeUI.kind === 'all' || s.kind === AnalyzeUI.kind; });
    if (!arr.length) { body.appendChild(h('div', { class: 'empty', text: 'この条件のショートがありません' })); return; }
    var rows = arr.map(function (s) { return { s: s, m: metrics(s) }; });

    // --- 気づきカード（再生数で上位半分と下位半分を比べる）---
    var ranked = rows.filter(function (r) { return r.s.views > 0; }).sort(function (a, b) { return b.s.views - a.s.views; });
    if (ranked.length >= 2) {
      var half = Math.ceil(ranked.length / 2), top = ranked.slice(0, half), low = ranked.slice(half);
      var withCTA = ranked.filter(function (r) { return r.m.hasCTA; }), noCTA = ranked.filter(function (r) { return !r.m.hasCTA; });
      function card(k, a, b, unit, s) {
        return h('div', { class: 'insight' }, h('div', { class: 'k', text: k }),
          h('div', { class: 'v' }, dash(a, unit), h('span', { class: 'hint', style: { fontSize: '13px' }, text: '  vs  ' + dash(b, unit) })),
          h('div', { class: 's', text: s }));
      }
      body.appendChild(h('div', { class: 'insights' },
        card('フックの長さ', avgOf(top, function (r) { return r.m.hookSec; }), avgOf(low, function (r) { return r.m.hookSec; }), '秒', '再生上位' + top.length + '本の平均 vs 下位'),
        card('オチの位置', avgOf(top, function (r) { return r.m.punchPct; }), avgOf(low, function (r) { return r.m.punchPct; }), '%', '尺に対する位置（上位 vs 下位）'),
        card('カット数', avgOf(top, function (r) { return r.m.cutCount; }), avgOf(low, function (r) { return r.m.cutCount; }), '回', '上位 vs 下位'),
        card('平均再生（CTAあり／なし）', withCTA.length ? fmtNum(Math.round(avgOf(withCTA, function (r) { return r.s.views; }))) : null,
          noCTA.length ? fmtNum(Math.round(avgOf(noCTA, function (r) { return r.s.views; }))) : null, '', 'CTAあり' + withCTA.length + '本 vs なし' + noCTA.length + '本')));
    }

    // --- 構成の並び比較 ---
    var byViews = rows.slice().sort(function (a, b) { return (b.s.views || 0) - (a.s.views || 0); });
    var cmp = h('div', { class: 'compare' }, h('h3', { style: { margin: '0 0 8px', fontSize: '14.5px' }, text: '構成の比較（再生数の多い順）' }),
      h('div', { class: 'legend' }, App.state.blockTypes.map(function (bt) { return h('span', null, h('span', { class: 'swatch', style: { background: bt.color } }), bt.name); }),
        h('span', null, h('span', { class: 'swatch', style: { background: '#1d1f24', width: '3px' } }), 'カット')));
    byViews.slice(0, 40).forEach(function (r) {
      cmp.appendChild(h('div', { class: 'cmp-row' },
        h('div', { class: 't', title: r.s.title, onclick: function () { App.go('edit', r.s.id); }, text: r.s.title || '無題' }),
        h('div', { class: 'v', text: fmtNum(r.s.views) }),
        renderBand(r.s)));
    });
    body.appendChild(cmp);

    // --- 表 ---
    var cols = [
      ['title', 'タイトル', function (r) { return r.s.title || '無題'; }, false],
      ['kind', '種別', function (r) { return KIND_LABELS[r.s.kind]; }, false],
      ['views', '再生数', function (r) { return r.s.views; }, true, fmtNum],
      ['likes', '高評価', function (r) { return r.s.likes; }, true, fmtNum],
      ['comments', 'コメント', function (r) { return r.s.comments; }, true, fmtNum],
      ['duration', '尺', function (r) { return r.s.duration || null; }, true, function (v) { return dash(v, '秒'); }],
      ['hookSec', 'フック', function (r) { return r.m.hookSec; }, true, function (v) { return dash(v, '秒'); }],
      ['punchPct', 'オチ位置', function (r) { return r.m.punchPct; }, true, function (v) { return dash(v, '%'); }],
      ['hasCTA', 'CTA', function (r) { return r.m.hasCTA ? 1 : 0; }, true, function (v) { return v ? 'あり' : 'なし'; }],
      ['cutCount', 'カット数', function (r) { return r.m.cutCount; }, true, String],
      ['avgCutSec', '平均カット', function (r) { return r.m.avgCutSec; }, true, function (v) { return dash(v, '秒'); }]
    ];
    var sc = cols.filter(function (c) { return c[0] === AnalyzeUI.sort; })[0] || cols[2];
    var sorted = rows.slice().sort(function (a, b) {
      var x = sc[2](a), y = sc[2](b);
      if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
      return sc[3] ? y - x : String(x).localeCompare(String(y), 'ja');
    });
    var tb = h('tbody');
    sorted.forEach(function (r) {
      tb.appendChild(h('tr', { style: { cursor: 'pointer' }, onclick: function () { App.go('edit', r.s.id); } }, cols.map(function (c) {
        var v = c[2](r);
        return h('td', { class: c[3] ? 'n' : '', text: c[4] ? c[4](v) : (v == null ? '—' : String(v)) });
      })));
    });
    body.appendChild(h('div', { class: 'table-wrap box', style: { padding: 0 } }, h('table', { class: 'grid' },
      h('thead', null, h('tr', null, cols.map(function (c) {
        return h('th', { class: c[0] === sc[0] ? 'sorted' : '', title: 'クリックで並べ替え', onclick: function () { AnalyzeUI.sort = c[0]; draw(); }, text: c[1] });
      }))), tb)));
  }
  var filter = segControl('an-kind', [['all', 'すべて'], ['research', '研究'], ['plan', '企画'], ['posted', '自分の投稿']], AnalyzeUI.kind, function (k) {
    AnalyzeUI.kind = k;
    filter.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.kind === k); });
    draw();
  });
  el.appendChild(h('div', { class: 'toolbar' }, h('h2', { class: 'page', text: '分析' }), filter));
  el.appendChild(body);
  draw();
}
window.renderAnalyze = renderAnalyze;

// ===== ui/app.js : 全体の制御 =====
function h(tag, attrs) {
  var el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    (Array.isArray(c) ? c : [c]).forEach(function (x) {
      if (x == null || x === false) return;
      el.appendChild(typeof x === 'string' || typeof x === 'number' ? document.createTextNode(String(x)) : x);
    });
  }
  return el;
}

function toast(msg, isError) {
  var t = h('div', { class: 'toast' + (isError ? ' error' : ''), text: msg });
  document.getElementById('toasts').appendChild(t);
  setTimeout(function () { t.classList.add('out'); }, isError ? 5000 : 2200);
  setTimeout(function () { t.remove(); }, isError ? 5600 : 2800);
}

function fmtNum(n) { return n == null ? '—' : Number(n).toLocaleString('ja-JP'); }
function dash(v, unit) { return v == null ? '—' : v + (unit || ''); }

var App = {
  ready: false,
  tab: 'list',
  currentId: null,
  state: { shorts: [], templates: [], blockTypes: DEFAULT_BLOCK_TYPES.slice() },

  init: function () {
    var self = this;
    document.querySelectorAll('nav [data-tab]').forEach(function (b) {
      b.addEventListener('click', function () { self.go(b.dataset.tab); });
    });
    this.initSettings();
    return this.load().then(function () { self.go('list'); self.ready = true; })
      .catch(function (e) { toast('データを開けませんでした: ' + e.message, true); });
  },

  load: function () {
    var st = this.state;
    return Promise.all([getAll('shorts'), getAll('templates'), getAll('settings')]).then(function (r) {
      st.shorts = r[0].map(normalizeShort);
      st.templates = r[1];
      var bt = r[2].filter(function (x) { return x.id === 'blockTypes'; })[0];
      st.blockTypes = bt && bt.list && bt.list.length ? bt.list : DEFAULT_BLOCK_TYPES.slice();
    });
  },

  find: function (id) { return this.state.shorts.filter(function (s) { return s.id === id; })[0] || null; },

  save: function (s) {
    var n = normalizeShort(s);
    n.updatedAt = Date.now();
    var arr = this.state.shorts, i = arr.findIndex(function (x) { return x.id === n.id; });
    if (i >= 0) arr[i] = n; else arr.push(n);
    return put('shorts', n).then(function () { return n; }, function (e) {
      toast('保存できませんでした（' + (e && (e.name || e.message)) + '）。容量不足の場合はスクショを減らすか、バックアップを書き出してください', true);
      throw e;
    });
  },

  saveTemplate: function (t) {
    var arr = this.state.templates, i = arr.findIndex(function (x) { return x.id === t.id; });
    if (i >= 0) arr[i] = t; else arr.push(t);
    return put('templates', t).then(function () { return t; });
  },

  saveBlockTypes: function () {
    return put('settings', { id: 'blockTypes', list: this.state.blockTypes });
  },

  remove: function (store, id) {
    this.state[store] = this.state[store].filter(function (x) { return x.id !== id; });
    if (store === 'shorts' && this.currentId === id) this.currentId = null;
    return del(store, id);
  },

  blockColor: function (name) {
    var t = this.state.blockTypes.filter(function (b) { return b.name === name; })[0];
    return t ? t.color : '#999';
  },

  go: function (tab, arg) {
    if (this.tab === 'edit' && window.editSaveNow) editSaveNow();
    if (window.destroyPlayer && (tab !== 'edit' || arg)) destroyPlayer();
    this.tab = tab;
    if (tab === 'edit' && arg) this.currentId = arg;
    document.querySelectorAll('nav [data-tab]').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === tab); });
    document.querySelectorAll('.tab').forEach(function (s) { s.classList.toggle('hidden', s.id !== 'tab-' + tab); });
    this.render();
    window.scrollTo(0, 0);
  },

  render: function () {
    var el = document.getElementById('tab-' + this.tab);
    el.innerHTML = '';
    var fn = { list: window.renderList, edit: window.renderEdit, templates: window.renderTemplates, analyze: window.renderAnalyze }[this.tab];
    if (fn) fn(el);
  },

  initSettings: function () {
    var self = this, mode = 'add';
    var panel = document.getElementById('settings-panel');
    var file = document.getElementById('import-file');
    document.getElementById('btn-settings').addEventListener('click', function () { panel.classList.toggle('hidden'); });
    document.getElementById('export').addEventListener('click', function () {
      var blob = new Blob([exportData(self.state)], { type: 'application/json' });
      var a = h('a', { href: URL.createObjectURL(blob), download: 'short-kousei-backup-' + new Date().toISOString().slice(0, 10) + '.json' });
      document.body.appendChild(a); a.click(); a.remove();
      toast('書き出しました');
    });
    document.getElementById('import-add').addEventListener('click', function () { mode = 'add'; file.value = ''; file.click(); });
    document.getElementById('import-replace').addEventListener('click', function () { mode = 'replace'; file.value = ''; file.click(); });
    file.addEventListener('change', function () {
      var f = file.files[0];
      if (!f) return;
      f.text().then(function (text) {
        var r = validateImport(text);
        if (!r.ok) { toast(r.error + '（データは変更していません）', true); return; }
        if (mode === 'replace' && !confirm('今のデータをすべて消して、読み込んだデータに置き換えます。よろしいですか？')) return;
        return self.importData(r.data, mode).then(function () {
          toast((mode === 'replace' ? '置き換えました' : '追加しました') + '（ショート' + r.data.shorts.length + '件・型' + r.data.templates.length + '件）');
          self.render();
        });
      }).catch(function (e) { toast('読み込みに失敗しました（データは変更していません）: ' + (e && e.message), true); self.render(); });
    });
  },

  importData: function (data, mode) {
    var self = this;
    var shorts = data.shorts.map(normalizeShort), templates = data.templates;
    var local = {};
    self.state.shorts.forEach(function (s) { local[s.id] = s; });
    if (mode === 'add') {
      // 同じIDで手元の方が新しいものは上書きしない
      shorts = shorts.filter(function (s) { var l = local[s.id]; return !l || (Number(s.updatedAt) || 0) > (Number(l.updatedAt) || 0); });
    }
    var blockTypes = null;
    if (data.blockTypes && data.blockTypes.length) {
      if (mode === 'replace') blockTypes = data.blockTypes;
      else {
        var names = self.state.blockTypes.map(function (b) { return b.name; });
        blockTypes = self.state.blockTypes.concat(data.blockTypes.filter(function (b) { return b && names.indexOf(b.name) < 0; }));
      }
    }
    if (window.editDiscardDraft) editDiscardDraft();
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction(['shorts', 'templates', 'settings'], 'readwrite');
        t.oncomplete = function () { res(); };
        t.onerror = function (e) { e.preventDefault(); };
        t.onabort = function () { rej(t.error || new Error('読み込みを取り消しました')); };
        try {
          if (mode === 'replace') ['shorts', 'templates', 'settings'].forEach(function (n) { t.objectStore(n).clear(); });
          shorts.forEach(function (s) { t.objectStore('shorts').put(s); });
          templates.forEach(function (x) { t.objectStore('templates').put(x); });
          if (blockTypes) t.objectStore('settings').put({ id: 'blockTypes', list: blockTypes });
        } catch (e) {
          try { t.abort(); } catch (e2) { /* already finished */ }
          rej(e);
        }
      });
    }).then(function () { return self.load(); }, function (e) { return self.load().then(function () { throw e; }); });
  }
};
window.App = App;

document.addEventListener('DOMContentLoaded', function () { App.init(); });

</script>
